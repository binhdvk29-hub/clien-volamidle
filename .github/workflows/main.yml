name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode release keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64.Trim())
            $appDir = Get-ChildItem -Path $PWD -Filter "build.gradle.kts" -Recurse | Where-Object { $_.Directory.Name -eq "app" } | Select-Object -First 1
            if ($appDir) {
              $projRoot = $appDir.Directory.Parent.FullName
            } else {
              $projRoot = $PWD
            }
            $outPath = Join-Path $projRoot "my-upload-key.jks"
            [IO.File]::WriteAllBytes($outPath, $bytes)
            Write-Host "Wrote keystore to $outPath"
          }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build signed Release APK
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GW_PATH=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1)
          if [ -n "$GW_PATH" ]; then
            chmod +x "$GW_PATH"
            PROJ_DIR=$(dirname "$GW_PATH")
            cd "$PROJ_DIR"
            ./gradlew assembleRelease --no-daemon
          else
            GRADLE_ROOT=$(find . -maxdepth 4 -name "settings.gradle.kts" -type f | head -n 1)
            if [ -n "$GRADLE_ROOT" ]; then
              cd "$(dirname "$GRADLE_ROOT")"
            fi
            gradle assembleRelease --no-daemon
          fi

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.4.17
          name: "Vo Lam Idle v5.4.17"
          files: "**/app/build/outputs/apk/release/*.apk"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
